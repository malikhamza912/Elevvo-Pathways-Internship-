<html>
    <head>
        <title>Task 2: Contact Form</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1>Welcome to our Contact Us page!</h1>
        <form>
            <h2>Please fill the form below to send us a message!</h2>
            <div class="form-items">
            <label for="full-name">Full Name</label>
            <input type="text" id="inputs" class="full-name" name="full-name" placeholder="Please enter your full name" required>

            <label for="email-address">Email Address</label>
            <input type="email" id="inputs" class="email-address" name="email-address" placeholder="Please enter your email address" required>

            <label for="subject">Subject</label>
            <select id="inputs" class="subject">
                <option value="general">General</option>
                <option value="feedback">Feedback</option>
                <option value="inquiry">Inquiry</option>
            </select>
        
            <label for="message">Message</label>
            <textarea  id="inputs" class="message" name="message" rows="4" placeholder="Please enter your message" required></textarea>
            </div>
            
            <button class="submit-btn" type="submit" onclick="validateForm()">Submit</button>
        </form>
    </body>
</html>
